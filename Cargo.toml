[package]
name = "denver"
version = "0.1.0"
edition = "2024"
description = "A TUI application for managing .env files across multiple projects"
license = "MIT"

[dependencies]
# TUI Framework
ratatui = "0.29"
crossterm = "0.28"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Text input widget
tui-input = "0.11"

# YAML parsing for K8s configs
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[[bin]]
name = "denver"
path = "src/main.rs"
